name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run validate:tools

      - run: npm run validate:links

      - run: npm run test:tools

      - run: npm run lint

      - run: npm run build
